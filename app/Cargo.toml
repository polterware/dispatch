[package]
name = "dispatch-app"
description = "Polterware Dispatch, the desktop app, in GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui.workspace = true
# The `dispatch` CLI and core, which this binary also is.
dispatch-core = { path = "../crates/dispatch-core" }
image = { version = "0.25.1", default-features = false, features = ["png"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.6"
# An async channel, so a transcript awaits its run's events instead of blocking a thread.
futures = { version = "0.3", default-features = false, features = ["std"] }
ureq = { version = "2.12", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
polterware-ui.workspace = true
raw-window-handle = "0.6.2"
# The voice engine's protocol, discovery file, and paths (`app/src/voice.rs`).
voice-core.workspace = true
tungstenite = "0.24"

[dev-dependencies]
tempfile = "3.27.0"
gpui = { workspace = true, features = ["test-support"] }
tungstenite = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[lints]
workspace = true
