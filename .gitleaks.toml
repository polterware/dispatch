# gitleaks: the default rules, minus test data that only looks like secrets.
[extend]
useDefault = true

[[allowlists]]
description = "The sandbox redactor's fake secrets and the message ids of recorded Claude streams."
paths = [
  '''go-core/providers/sandbox/sandbox_test\.go''',
  '''crates/dispatch-core/tests/adapters_sandbox\.rs''',
  '''(go-core/providers/adapters/testdata|crates/dispatch-core/tests/fixtures/adapters)/.*\.ndjson''',
]
