[package]
name = "dispatch-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
prost = "0.14"
pbjson = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
axum = { version = "0.8.9", features = ["http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
hyper = "1.12.0"
tower = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2"] }
security-framework = "3.7.0"
nix = { version = "0.31.3", features = ["signal", "process", "fs", "term"] }
libc = "0.2.191"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.3"
regex = "1.13.1"
dirs = "7.0.0"
bytes = "1.12.1"
futures = "0.3.34"

[build-dependencies]
prost-build = "0.14"
pbjson-build = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
